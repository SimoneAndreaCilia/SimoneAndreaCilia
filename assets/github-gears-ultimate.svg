<svg fill="none" viewBox="0 0 850 192" width="100%" height="192" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          display: flex;
          align-items: center;
          height: 192px;
          background-color: #0d1117;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          overflow: hidden;
          position: relative;
        }

        /* GRIGLIA SFONDO (Quadratini spenti) */
        .bg-grid {
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          display: grid;
          grid-template-columns: repeat(60, 12px); /* Abbastanza colonne per riempire tutto */
          grid-template-rows: repeat(9, 12px);
          gap: 3px;
          padding: 30px;
          opacity: 0.2; /* Molto tenue per non disturbare */
          z-index: 0;
        }
        .pixel-off {
          width: 12px; height: 12px; border-radius: 2px;
          background-color: #161b22;
        }

        /* GLI INGRANAGGI (Contenitore Principale) */
        .gears-wrapper {
          position: relative;
          width: 350px; /* Spazio occupato dagli ingranaggi */
          height: 192px;
          margin-left: 50px;
          z-index: 10;
        }

        /* STILE COMUNE DEI PIXEL DEGLI INGRANAGGI */
        .g-pixel {
          position: absolute;
          width: 12px; height: 12px; border-radius: 2px;
          background-color: #0e4429; /* Base verde scuro */
          box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        /* --- ANIMAZIONE ROTAZIONE FISICA --- */
        .gear-structure {
          position: absolute;
          /* Il centro di rotazione sarà gestito nei singoli ID */
        }
        
        .spin-cw { animation: physicalRotate 20s infinite linear; }
        .spin-ccw { animation: physicalRotateCCW 20s infinite linear; }

        @keyframes physicalRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes physicalRotateCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }


        /* --- ANIMAZIONE ONDA COLORE (LOADING EFFECT) --- */
        /* Questa animazione fa pulsare i colori in sequenza */
        .wave-anim {
          animation: waveColor 1.5s infinite ease-in-out;
        }
        @keyframes waveColor {
          0%, 100% { background-color: #0e4429; box-shadow: none; }
          50%      { background-color: #39d353; box-shadow: 0 0 8px #39d353; } /* Verde brillante + Glow */
        }

        /* Ritardi per l'onda circolare (basati sulla posizione nel cerchio) */
        .d-0 { animation-delay: 0s; }
        .d-1 { animation-delay: 0.1s; }
        .d-2 { animation-delay: 0.2s; }
        .d-3 { animation-delay: 0.3s; }
        .d-4 { animation-delay: 0.4s; }
        .d-5 { animation-delay: 0.5s; }
        .d-6 { animation-delay: 0.6s; }
        .d-7 { animation-delay: 0.7s; }
        .d-8 { animation-delay: 0.8s; }
        .d-9 { animation-delay: 0.9s; }
        .d-10 { animation-delay: 1.0s; }
        .d-11 { animation-delay: 1.1s; }


        /* TESTO */
        .text-block {
          z-index: 20;
          margin-left: 20px;
          background: rgba(13, 17, 23, 0.8);
          padding: 15px;
          border-radius: 8px;
          border: 1px solid #30363d;
          backdrop-filter: blur(4px);
        }
        h1 { color: #e6edf3; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
        p { color: #8b949e; margin: 5px 0 0 0; font-size: 14px; }

      </style>
      
      <div class="container">
        <div class="bg-grid">
           <div class="pixel-off"></div><div class="pixel-off"></div><div class="pixel-off"></div>
           <div class="pixel-off"></div><div class="pixel-off"></div><div class="pixel-off"></div>
           <div class="pixel-off"></div><div class="pixel-off"></div><div class="pixel-off"></div>
           </div>

        <div class="gears-wrapper">
          
          <div class="gear-structure spin-cw" style="top: 30px; left: 20px; width: 100px; height: 100px;">
            <div class="g-pixel wave-anim d-0" style="top: 0; left: 45px;"></div>
            <div class="g-pixel wave-anim d-1" style="top: 15px; left: 75px;"></div>
            <div class="g-pixel wave-anim d-2" style="top: 45px; left: 90px;"></div>
            <div class="g-pixel wave-anim d-3" style="top: 75px; left: 75px;"></div>
            <div class="g-pixel wave-anim d-4" style="top: 90px; left: 45px;"></div>
            <div class="g-pixel wave-anim d-5" style="top: 75px; left: 15px;"></div>
            <div class="g-pixel wave-anim d-6" style="top: 45px; left: 0px;"></div>
            <div class="g-pixel wave-anim d-7" style="top: 15px; left: 15px;"></div>
            
            <div class="g-pixel wave-anim d-0" style="top: 15px; left: 45px;"></div>
            <div class="g-pixel wave-anim d-1" style="top: 30px; left: 60px;"></div>
            <div class="g-pixel wave-anim d-2" style="top: 45px; left: 75px;"></div>
            <div class="g-pixel wave-anim d-3" style="top: 60px; left: 60px;"></div>
            <div class="g-pixel wave-anim d-4" style="top: 75px; left: 45px;"></div>
            <div class="g-pixel wave-anim d-5" style="top: 60px; left: 30px;"></div>
            <div class="g-pixel wave-anim d-6" style="top: 45px; left: 15px;"></div>
            <div class="g-pixel wave-anim d-7" style="top: 30px; left: 30px;"></div>
            
            <div class="g-pixel" style="top: 30px; left: 45px; opacity:0.5;"></div>
            <div class="g-pixel" style="top: 45px; left: 60px; opacity:0.5;"></div>
            <div class="g-pixel" style="top: 60px; left: 45px; opacity:0.5;"></div>
            <div class="g-pixel" style="top: 45px; left: 30px; opacity:0.5;"></div>
          </div>

          <div class="gear-structure spin-ccw" style="top: 10px; left: 130px; width: 80px; height: 80px;">
             <div class="g-pixel wave-anim d-0" style="top: 0; left: 30px;"></div>
            <div class="g-pixel wave-anim d-1" style="top: 15px; left: 60px;"></div>
            <div class="g-pixel wave-anim d-2" style="top: 45px; left: 60px;"></div>
            <div class="g-pixel wave-anim d-3" style="top: 60px; left: 30px;"></div>
            <div class="g-pixel wave-anim d-4" style="top: 45px; left: 0px;"></div>
            <div class="g-pixel wave-anim d-5" style="top: 15px; left: 0px;"></div>

            <div class="g-pixel wave-anim d-0" style="top: 15px; left: 30px;"></div>
            <div class="g-pixel wave-anim d-1" style="top: 30px; left: 45px;"></div>
            <div class="g-pixel wave-anim d-2" style="top: 45px; left: 30px;"></div>
            <div class="g-pixel wave-anim d-3" style="top: 30px; left: 15px;"></div>
            
             <div class="g-pixel" style="top: 30px; left: 30px; opacity:0.5;"></div>
          </div>

          <div class="gear-structure spin-cw" style="top: 100px; left: 110px; width: 60px; height: 60px;">
            <div class="g-pixel wave-anim d-0" style="top: 0; left: 22px;"></div>
            <div class="g-pixel wave-anim d-2" style="top: 22px; left: 45px;"></div>
            <div class="g-pixel wave-anim d-4" style="top: 45px; left: 22px;"></div>
            <div class="g-pixel wave-anim d-6" style="top: 22px; left: 0px;"></div>
            
            <div class="g-pixel wave-anim d-1" style="top: 15px; left: 30px;"></div>
            <div class="g-pixel wave-anim d-3" style="top: 30px; left: 30px;"></div>
            <div class="g-pixel wave-anim d-5" style="top: 30px; left: 15px;"></div>
            <div class="g-pixel wave-anim d-7" style="top: 15px; left: 15px;"></div>
          </div>

        </div>

        <div class="text-block">
          <h1>UNDER CONSTRUCTION</h1>
          <p>Commiting changes &amp; building layout...</p>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
